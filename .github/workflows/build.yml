name: Seslen APK and security tests
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest lintDebug
        working-directory: android-tv
      - uses: actions/upload-artifact@v4
        with:
          name: seslen-0.4.1-test-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android-tv/app/build/reports
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check


  publish-test-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/tv-presence-041'
    needs: [android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seslen-0.4.1-test-apk
          path: apk
      - name: Publish directly downloadable debug APK as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s apk/app-debug.apk
          cp apk/app-debug.apk Seslen-0.4.1-TEST.apk
          gh release create v0.4.1-test-20261110 Seslen-0.4.1-TEST.apk --target "${GITHUB_SHA}" --title 'Seslen 0.4.1 TEST (Android TV)' --prerelease --notes 'TV alıcısı 0.4.1 test derlemesi. TV son bağlantı göstergesi için eşleşen Worker ve D1 migration ayrıca yayımlanmalıdır. Üretim imzalı sürüm değildir; mevcut imzalı uygulamanın üzerine kurulamayabilir. TV uyandırma özelliği henüz yok.'
