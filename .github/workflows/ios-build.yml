name: Seslen native iOS simulator build
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare Seslen app icon from existing logo
        run: bash ios/prepare-assets.sh
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build native iPhone simulator app (no signing, no production changes)
        run: |
          xcodebuild -project ios/Seslen.xcodeproj -scheme Seslen -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone device app (requires signing for real devices)
        run: |
          xcodebuild -project ios/Seslen.xcodeproj -scheme Seslen -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath ios/DerivedData-Device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned iPhone IPA for Apple signing
        run: |
          mkdir -p ios/dist/Payload
          cp -R ios/DerivedData-Device/Build/Products/Debug-iphoneos/Seslen.app ios/dist/Payload/Seslen.app
          (cd ios/dist && zip -q -r Seslen-0.1.0-unsigned.ipa Payload)
      - name: Upload unsigned iPhone IPA (not directly installable)
        uses: actions/upload-artifact@v4
        with:
          name: seslen-ios-device-unsigned-ipa
          path: ios/dist/Seslen-0.1.0-unsigned.ipa
          retention-days: 7
      - name: Upload unsigned simulator build
        uses: actions/upload-artifact@v4
        with:
          name: seslen-ios-simulator-unsigned
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/Seslen.app
          retention-days: 7
