name: Seslen Google giriş anahtarını aktar

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: seslen-staging-google-secret
  cancel-in-progress: false

jobs:
  aktar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Google giriş anahtarını seslen-staging Worker'ına kaydet
        shell: python
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          for name in ("GOOGLE_CLIENT_SECRET", "CLOUDFLARE_API_TOKEN"):
              if not os.environ[name].strip():
                  raise SystemExit(f"GitHub Actions secret eksik: {name}")

          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              "d7bfee579045e79fcde7ba1639f39287/workers/scripts/seslen-staging/secrets"
          )
          payload = {"name": "GOOGLE_CLIENT_SECRET", "type": "secret_text",
                     "text": os.environ["GOOGLE_CLIENT_SECRET"]}
          request = Request(endpoint, method="PUT", data=json.dumps(payload).encode(),
                            headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
                                     "Content-Type": "application/json"})
          try:
              with urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except HTTPError as error:
              raise SystemExit(f"Cloudflare aktarımı başarısız: HTTP {error.code}") from None
          if not result.get("success"):
              raise SystemExit("Cloudflare anahtarın kaydedildiğini doğrulamadı.")
          print("Google giriş anahtarı seslen-staging Worker'ına kaydedildi.")
