name: Seslen
options:
  bundleIdPrefix: site.serula
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Seslen:
    type: application
    platform: iOS
    sources:
      - path: Seslen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.serula.seslen.ios
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Seslen/Info.plist
      properties:
        CFBundleDisplayName: Seslen
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["seslen"]
        NSMicrophoneUsageDescription: "Sevdiklerine kendi sesinle mesaj göndermek için mikrofon izni gerekir."
        NSCameraUsageDescription: "Televizyonun QR kodunu okutarak güvenli biçimde eşleştirmek için kamera izni gerekir."
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleDefault
        UILaunchScreen: {}
